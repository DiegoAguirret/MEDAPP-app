warnings:
  - La tableta y la suspensión no son bioequivalentes ni se sustituyen mg por mg (FDA). Quien no traga la tableta entera debe recibir la suspensión.
  - La suspensión contiene fenilalanina (4.5 mg por 5 mL); precaución en fenilcetonuria (FDA).
  - En el Perú solo figuran la suspensión de 250 mg/5 mL y la tableta de 500 mg (PNUME 2023); no figura la cefuroxima inyectable.
contraindications:
  - Alergia a las cefalosporinas (o anafilaxia a otros betalactámicos, según la ficha FDA de las tabletas).
interactions:
  - No se recomienda junto con probenecid (FDA).
  - Dar al menos 1 h antes o 2 h después de antiácidos de acción corta; evitar antihistamínicos H2 e inhibidores de bomba de protones (FDA).
  - Puede reducir la eficacia de los anticonceptivos orales (FDA).
  - Falso positivo de glucosa en orina con pruebas de reducción de cobre (FDA).
renal: FDA — en insuficiencia renal no se ha establecido la seguridad ni la eficacia de la suspensión.
diagnoses: [faringoamigdalitis, otitis media aguda, sinusitis, impétigo]
