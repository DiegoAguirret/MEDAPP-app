    intervalHours: 24
    maxPerDoseMg: 1500
    maxPerDayMg: 1500
    durationText: Solo en la primera fase (2 meses, HREZ), diario de lunes a sábado (NTS 221).
    notes: >-
      NTS 221-MINSA 2024 — menores de 15 años, 30 a 40 mg/kg/día; máximo 1500 mg/día. Dosis habitual 35 mg/kg
      (NTS 200-2023 y OMS).
    sourceIds: [minsa-nts221-2024, who-tb-children-2022, digemid-pnume-2023]
warnings:
  - En hepatopatía (Child A), diseñar esquemas con solo 2 fármacos potencialmente hepatotóxicos y, de preferencia, evitar la pirazinamida (NTS 221).
contraindications:
  - Insuficiencia hepática severa.
  - Ataque agudo de gota.
  - Hipersensibilidad a la pirazinamida.
  - Porfiria.
interactions:
  - Con alopurinol, aumento del ácido úrico; usar colchicina (NTS 221).
  - Con rifampicina, riesgo de daño hepático grave (OMS).
renal: NTS 221 — en enfermedad renal crónica severa, 25 a 30 mg/kg 3 veces por semana, no diario.
diagnoses: [tuberculosis, tuberculosis pulmonar]
