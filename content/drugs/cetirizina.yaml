rules:
  - id: alergia-6-23-meses
    indication: Rinitis alérgica perenne o urticaria crónica (6 a 23 meses)
    route: VO
    ageMinDays: 180
    ageMaxDays: 729
    basis: fixed_by_age
    amountMin: 2.5
    amountMax: 2.5
    usual: 2.5
    intervalHours: 24
    maxPerDoseMg: 2.5
    maxPerDayMg: 2.5
    notes: >-
      FDA — de 12 a 23 meses se puede aumentar a 2.5 mg cada 12 h (máximo 5 mg/día). Libro Peña
      Camarena — 0.25 mg/kg/día cada 12–24 h; no recomendado en menores de 6 meses.
    presentationIds: [sol-1, gotas-10]
    sourceIds: [fda-cetirizine-rx, pena-camarena]
  - id: alergia-2-5-anos
    indication: Rinitis alérgica o urticaria (2 a 5 años)
    route: VO
    ageMinDays: 730
    ageMaxDays: 2189
    basis: fixed_by_age
    amountMin: 2.5
    amountMax: 5
    usual: 2.5
    intervalHours: 24
    maxPerDoseMg: 5
    maxPerDayMg: 5
    notes: FDA — inicio 2.5 mg/día, máximo 5 mg/día. AEMPS — 2.5 mg cada 12 h (mismo total).
    presentationIds: [sol-1, gotas-10]
    sourceIds: [fda-cetirizine-rx, aemps-ft-80453]
  - id: alergia-6-anos-o-mas
    indication: Rinitis alérgica o urticaria (6 años o más)
    route: VO
    ageMinDays: 2190
    basis: fixed_by_age
    amountMin: 5
    amountMax: 10
    usual: 10
    intervalHours: 24
    maxPerDoseMg: 10
    maxPerDayMg: 10
    notes: FDA — 5 o 10 mg una vez al día, máximo 10 mg/día. AEMPS — de 6 a 12 años, 5 mg cada 12 h (mismo total).
    sourceIds: [fda-cetirizine-otc, aemps-ft-80453]
warnings:
  - Puede causar somnolencia.
  - Ajustar la dosis en insuficiencia renal.
contraindications:
  - Insuficiencia renal terminal (aclaramiento menor de 10 mL/min).
diagnoses: [rinitis alérgica, urticaria]
review:
  status: borrador
  author: Diego
  reviewers: []
