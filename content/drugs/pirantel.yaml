    label: Suspensión 250 mg/5 mL (como pirantel base)
    form: suspension
    mgPerUnit: 50
    unit: mL
    step: 0.1
    brandsPE: [Combantrin]
  - id: tab-125
    label: Tableta 125 mg
    form: tableta
