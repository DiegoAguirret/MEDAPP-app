warnings:
  - La dosis está en mg de antimonio pentavalente. El estibogluconato (100 mg/mL) y el antimoniato de meglumina (81 a 85 mg/mL) no son equivalentes (OMS).
  - Precaución con fármacos que prolongan el QT (FNME).
contraindications:
  - Hipersensibilidad al estibogluconato.
  - Enfermedad cardíaca, hepática, renal, pancreática o hematológica grave previa (OMS).
  - Embarazo (OMS).
