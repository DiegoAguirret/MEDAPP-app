warnings:
  - No hay ensayos clínicos controlados en niños (FDA); el FNME dice que no se ha establecido su seguridad en niños.
  - Vigilar electrolitos; la hipopotasemia aumenta la toxicidad de la digoxina.
contraindications:
  - Anuria.
  - Hipersensibilidad a la hidroclorotiazida o a otros derivados de las sulfonamidas.
interactions:
  - Con digoxina, la hipopotasemia aumenta la toxicidad digitálica (FNME).
  - Con litio, en general no se debe dar junto con diuréticos (FDA).
  - Corticoides, anfotericina B y otros diuréticos aumentan la hipopotasemia (FDA).
  - Los AINE reducen su efecto diurético y antihipertensivo (FDA).
  - Colestiramina y colestipol reducen su absorción; separar las tomas (FDA, FNME).
renal: FNME — evitar si la depuración de creatinina es menor de 30 mL/min y vigilar electrolitos. FDA — en enfermedad renal puede precipitar azoemia; si la función renal empeora, suspender.
renalTiers:
