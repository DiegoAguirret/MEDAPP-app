    maxPerDoseMg: 30
    maxPerDayMg: 30
    notes: >-
      OMS (Pocket Book 2013) — una dosis de dexametasona oral 0.6 mg/kg. La fuente no da tope en mg (el
      tope de la regla es técnico, 0.6 mg/kg con 50 kg).
    sourceIds: [who-pocket-2013, digemid-pnume-2023]
  - id: asma-5-anos-o-menos
    indication: Crisis de asma moderada o grave (5 años o menos)
    route: VO
    ageMinDays: 29
    ageMaxDays: 2190
    basis: mg/kg/dose
    amountMin: 0.3
    amountMax: 0.6
    usual: 0.3
    once: true
    maxPerDoseMg: 12
    maxPerDayMg: 12
    notes: GINA 2025 — dosis inicial de dexametasona oral 0.3 a 0.6 mg/kg (máximo 12 mg), como alternativa a la prednisolona.
    sourceIds: [gina-2025, digemid-pnume-2023]
warnings:
  - En el crup, elegir la solución oral; la dosis se mide mejor que con tabletas.
contraindications:
  - Infección sistémica por hongos.
diagnoses: [crup, laringotraqueobronquitis, crisis asmática]
