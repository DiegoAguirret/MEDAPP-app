rules:
  - id: crup
    indication: Crup (laringotraqueobronquitis), dosis única
    route: VO
    ageMinDays: 29
    weightMaxKg: 50
    basis: mg/kg/dose
    amountMin: 0.6
    amountMax: 0.6
    usual: 0.6
