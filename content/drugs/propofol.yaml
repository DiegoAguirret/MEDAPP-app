rules:
  - id: induccion-3-16-anos
    indication: Inducción de anestesia general, 3 a 16 años (ASA I o II)
    route: IV
    ageMinDays: 1095
    ageMaxDays: 6209
    weightMaxKg: 50
    basis: mg/kg/dose
    amountMin: 2.5
    amountMax: 3.5
