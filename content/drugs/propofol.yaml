    maxPerDoseMg: 175
    maxPerDayMg: 175
    notes: >-
      FDA (Diprivan) — de 3 a 16 años, ASA I o II, 2.5 a 3.5 mg/kg para la inducción sin premedicación o con
      premedicación ligera; los más pequeños pueden necesitar dosis mayores. Dosis menor en ASA III o IV. Tope
      técnico (3.5 mg/kg con 50 kg).
    presentationIds: [emulsion-10]
    sourceIds: [fda-diprivan, digemid-pnume-2023]
warnings:
  - No se recomienda para la inducción en menores de 3 años ni para el mantenimiento en menores de 2 meses (FDA).
  - La sedación en UCI con propofol está aprobada solo en adultos (FDA).
  - Puede causar depresión cardiorrespiratoria (hipotensión, apnea, obstrucción de la vía aérea, desaturación). Prevenir el dolor de la inyección en niños (FDA).
contraindications:
  - Hipersensibilidad al propofol o a sus componentes.
  - Antecedente de anafilaxia al huevo, a productos de huevo, a la soya o a productos de soya.
diagnoses: [anestesia, inducción anestésica, intubación]
