warnings:
  - Si el paciente tuvo alteración del estado mental, no usar mefloquina por riesgo de complicaciones neuropsiquiátricas (NTS 233).
  - Las dosis en mg son de artesunato; la tableta trae además la mefloquina indicada en su etiqueta.
  - Con pesos con decimales entre bandas (por ejemplo 9.5 kg), la app usa la banda de menor peso.
contraindications:
  - Alteración del estado mental o antecedentes neuropsiquiátricos (mefloquina).
diagnoses: [malaria, paludismo, malaria falciparum, malaria no complicada]
