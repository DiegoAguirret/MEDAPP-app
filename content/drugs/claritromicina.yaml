rules:
  - id: usual
    indication: Otitis, faringitis, sinusitis, neumonía o piel (alérgicos a penicilina)
    route: VO
    ageMinDays: 180
    basis: mg/kg/dose
    amountMin: 7.5
    amountMax: 7.5
    usual: 7.5
    intervalHours: 12
    maxPerDoseMg: 500
    maxPerDayMg: 1000
    durationText: 10 días
    notes: >-
      FDA — 15 mg/kg/día dividido cada 12 h por 10 días, hasta la dosis de adulto (500 mg cada 12 h,
      tope usado aquí); eficacia establecida desde los 6 meses. Libro Peña Camarena — 15 mg/kg/día
      cada 12 h.
    sourceIds: [fda-clarithromycin, pena-camarena]
warnings:
  - No figura en el FNME 2008; la pauta es la de la ficha FDA.
  - Interacciones graves con cisaprida, pimozida, colchicina y algunas estatinas (FDA).
contraindications:
  - Hipersensibilidad a la claritromicina o a otro macrólido.
  - Uso junto con cisaprida o pimozida.
  - Ictericia colestásica o disfunción hepática previa con claritromicina.
diagnoses: [otitis media, faringitis, sinusitis, neumonía, alergia a penicilina, macrólido]
