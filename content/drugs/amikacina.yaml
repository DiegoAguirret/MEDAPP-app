warnings:
  - Ototoxicidad y nefrotoxicidad; vigilar niveles cuando sea posible. Evitar picos sobre 35 µg/mL y valles sobre 10 µg/mL (FDA, recuadro negro).
  - No se ha establecido la seguridad más allá de 14 días (FDA).
  - En el FNME es de uso restringido.
contraindications:
  - Hipersensibilidad a la amikacina o a otros aminoglucósidos.
interactions:
  - Evitar con diuréticos potentes como furosemida o ácido etacrínico (ototoxicidad, FDA).
  - Evitar otros fármacos neuro o nefrotóxicos, como vancomicina, anfotericina B, colistina u otros aminoglucósidos (FDA).
  - Riesgo de bloqueo neuromuscular y parálisis respiratoria con anestésicos y relajantes musculares (FDA).
  - No mezclar con betalactámicos en la misma solución, porque se inactivan entre sí (FDA).
renal: >-
  FDA — alargar el intervalo: horas entre dosis = creatinina sérica × 9; o reducir la dosis en
  proporción a la depuración de creatinina. FNME — por depuración: 60 mL/min o más, c/8 h; 40 a 60,
  c/12 h; 20 a 40, c/24 h; menos de 20, guiarse por niveles.
diagnoses: [sepsis, infección urinaria complicada, infecciones graves por gramnegativos]
