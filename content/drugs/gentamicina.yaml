    brandsPE: []
rules:
  - id: semana-1-bajo-peso
    indication: Primera semana de vida, bajo peso al nacer (menos de 2.5 kg)
    route: IV
    neonatal: true
    ageMinDays: 0
    ageMaxDays: 6
    weightMinKg: 1
    weightMaxKg: 2.5
    basis: mg/kg/dose
    amountMin: 3
    amountMax: 3
    usual: 3
    intervalHours: 24
    maxPerDoseMg: 7.5
    maxPerDayMg: 7.5
    notes: >-
      OMS (tabla neonatal) — primera semana, bajo peso al nacer: 3 mg/kg IM o IV una vez al día.
      Calcular con el peso exacto. La tabla de la OMS cubre de 1 a 4.5 kg.
    presentationIds: [sol-10]
    sourceIds: [who-pocket-2013]
  - id: semana-1-peso-normal
    indication: Primera semana de vida, peso normal al nacer (2.5 kg o más)
    route: IV
    neonatal: true
    ageMinDays: 0
    ageMaxDays: 6
    weightMinKg: 2.5
    weightMaxKg: 4.5
    basis: mg/kg/dose
    amountMin: 5
    amountMax: 5
    usual: 5
