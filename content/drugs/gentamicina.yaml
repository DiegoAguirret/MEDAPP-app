    brandsPE: []
rules:
  - id: semana-1-bajo-peso
    indication: Primera semana de vida, bajo peso al nacer (menos de 2.5 kg)
    route: IV
    neonatal: true
    ageMinDays: 0
    ageMaxDays: 6
    weightMinKg: 1
    weightMaxKg: 2.5
    basis: mg/kg/dose
    amountMin: 3
    amountMax: 3
    usual: 3
    intervalHours: 24
    maxPerDoseMg: 7.5
    maxPerDayMg: 7.5
    notes: >-
      OMS (tabla neonatal) — primera semana, bajo peso al nacer: 3 mg/kg IM o IV una vez al día.
      Calcular con el peso exacto. La tabla de la OMS cubre de 1 a 4.5 kg.
    presentationIds: [sol-10]
    sourceIds: [who-pocket-2013]
  - id: semana-1-peso-normal
    indication: Primera semana de vida, peso normal al nacer (2.5 kg o más)
    route: IV
    neonatal: true
    ageMinDays: 0
    ageMaxDays: 6
    weightMinKg: 2.5
    weightMaxKg: 4.5
    basis: mg/kg/dose
    amountMin: 5
    amountMax: 5
    usual: 5
    intervalHours: 24
    maxPerDoseMg: 22.5
    maxPerDayMg: 22.5
    notes: >-
      OMS (tabla neonatal) — primera semana, peso normal al nacer: 5 mg/kg IM o IV una vez al día.
    presentationIds: [sol-10]
    sourceIds: [who-pocket-2013]
  - id: semanas-2-4
    indication: Semanas 2 a 4 de vida
    route: IV
    neonatal: true
    ageMinDays: 7
    ageMaxDays: 28
    weightMinKg: 1
    weightMaxKg: 4.5
    basis: mg/kg/dose
    amountMin: 7.5
    amountMax: 7.5
    usual: 7.5
    intervalHours: 24
    maxPerDoseMg: 33.75
    maxPerDayMg: 33.75
    notes: >-
      OMS (tabla neonatal) — semanas 2 a 4 de vida: 7.5 mg/kg IM o IV una vez al día.
    presentationIds: [sol-10]
    sourceIds: [who-pocket-2013]
  - id: ninos-menores-5-anos
    indication: Niños de 1 mes a 5 años, IV o IM c/8 h
    route: IV
    ageMinDays: 29
    ageMaxDays: 1825
    weightMaxKg: 50
    basis: mg/kg/dose
    amountMin: 2.5
    amountMax: 2.5
    usual: 2.5
    intervalHours: 8
    maxPerDoseMg: 125
    maxPerDayMg: 375
    notes: >-
      FNME — niños menores de 5 años, 2.5 mg/kg/dosis IV o IM c/8 h; en lo posible no más de 7 días. FDA — 6 a
      7.5 mg/kg/día (2 a 2.5 mg/kg c/8 h). Sin tope en mg en esas fuentes (el tope es técnico, 2.5 mg/kg con 50 kg).
    presentationIds: [sol-10, amp-40]
    sourceIds: [fnme-2008, fda-gentamicin-ped, digemid-pnume-2023]
  - id: ninos-mayores-5-anos
    indication: Niños mayores de 5 años, IV o IM c/8 h
    route: IV
    ageMinDays: 1826
    weightMaxKg: 50
    basis: mg/kg/dose
    amountMin: 1.5
    amountMax: 2.5
    usual: 2
    intervalHours: 8
    maxPerDoseMg: 125
    maxPerDayMg: 375
    notes: >-
      FNME — mayores de 5 años, 1.5 a 2.5 mg/kg/dosis c/8 h. FDA — 2 a 2.5 mg/kg c/8 h. Sin tope en mg en esas
      fuentes (el tope es técnico, 2.5 mg/kg con 50 kg).
    presentationIds: [sol-10, amp-40]
    sourceIds: [fnme-2008, fda-gentamicin-ped, digemid-pnume-2023]
warnings:
  - En la primera semana la OMS distingue por peso al nacer; la app usa el peso que ingresas. Si el peso al nacer fue menor de 2.5 kg, elige la indicación de bajo peso.
  - Nefrotoxicidad y ototoxicidad; evitar niveles pico prolongados sobre 12 mcg/mL (FDA, recuadro negro).
  - El FNME contraindica el uso sistémico en neonatos e infantes, aunque en la misma monografía da dosis pediátricas.
contraindications:
  - Hipersensibilidad a los aminoglucósidos.
diagnoses:
  [
    sepsis neonatal,
    infección neonatal,
    neonato,
    recién nacido,
    aminoglucósido,
    infección urinaria,
    sepsis,
  ]
