    presentationIds: [sol-10]
    sourceIds: [who-pocket-2013]
  - id: semanas-2-4
    indication: Semanas 2 a 4 de vida
    route: IV
    neonatal: true
    ageMinDays: 7
    ageMaxDays: 28
    weightMinKg: 1
    weightMaxKg: 4.5
    basis: mg/kg/dose
    amountMin: 7.5
    amountMax: 7.5
    usual: 7.5
    intervalHours: 24
    maxPerDoseMg: 33.75
    maxPerDayMg: 33.75
