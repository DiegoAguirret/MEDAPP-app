rules:
  - id: ninos
    indication: Diurético o antihipertensivo, edema o ascitis (1 mes a 12 años)
    route: VO
    ageMinDays: 29
    ageMaxDays: 4744
    weightMaxKg: 50
    basis: mg/kg/day
    amountMin: 1
    amountMax: 3
    usual: 1
    intervalHours: 12
    maxPerDoseMg: 75
    maxPerDayMg: 150
    notes: >-
      FNME — inicial 1 a 3 mg/kg/d en una sola dosis o dividido en 2 a 4 tomas; reajustar a los 5 días;
      puede aumentarse hasta 3 veces la dosis inicial. El FNME no da tope en mg (el tope de la regla es
      técnico, 3 mg/kg/d con 50 kg).
    sourceIds: [fnme-2008, digemid-pnume-2023]
warnings:
  - Riesgo de hiperpotasemia, sobre todo con suplementos de potasio o IECA; vigilar el potasio.
  - La FDA no ha establecido su seguridad ni eficacia en niños y no la recomienda para la hipertensión pediátrica.
contraindications:
  - Hipersensibilidad a la espironolactona.
  - Hiperpotasemia.
  - Insuficiencia renal.
  - Enfermedad de Addison.
interactions:
  - Con IECA (enalapril, captopril) o ARA II, hiperpotasemia grave (FDA).
  - Suplementos de potasio y sustitutos de sal, hiperpotasemia (FDA, FNME).
  - Los AINE reducen el efecto diurético y suben el potasio (FDA).
  - Con litio, riesgo de toxicidad (FDA, FNME).
renal: FNME — contraindicada en insuficiencia renal. FDA — mayor riesgo de hiperpotasemia en insuficiencia renal.
diagnoses: [edema, ascitis, insuficiencia cardíaca, síndrome nefrótico]
