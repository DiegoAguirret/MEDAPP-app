rules:
  - id: anemia-menor-6-meses
    indication: Anemia por deficiencia de hierro (menor de 6 meses, a término y con buen peso al nacer)
    route: VO
    ageMinDays: 29
    ageMaxDays: 179
    basis: mg/kg/day
    amountMin: 3
    amountMax: 3
    usual: 3
    intervalHours: 24
    maxPerDoseMg: 40
    maxPerDayMg: 40
    durationText: 6 meses continuos
    notes: NTS 213-MINSA 2024 (Tabla 16) — 3 mg/kg/día de hierro elemental en gotas, diario, máximo 40 mg/día, por 6 meses.
    presentationIds: [gotas-sf, gotas-pmf]
    countryNotes:
      - country: PE
        text: >-
          El FNME 2008 indicaba 6 mg/kg/día de 6 meses a 2 años y 3 mg/kg/día de 2 a 12 años, en 3
          tomas. La NTS 213-MINSA 2024 vigente lo reemplaza por 3 mg/kg/día en una toma.
        sourceIds: [fnme-2008, minsa-nts213-2024]
    sourceIds: [minsa-nts213-2024]
