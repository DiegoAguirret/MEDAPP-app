warnings:
  - Todas las dosis son de hierro elemental, no de la sal; las concentraciones son las de la Tabla 3 de la NTS 213.
  - Al terminar el tratamiento se pasa a la suplementación preventiva según la edad (NTS 213). Esa pauta no se calcula aquí.
  - Los alimentos y la falta de ácido gástrico disminuyen su absorción (FNME).
contraindications:
  - Hipersensibilidad al sulfato ferroso.
  - Anemia no ferropénica.
  - Hemosiderosis o hemocromatosis.
diagnoses: [anemia, anemia ferropénica, deficiencia de hierro]
