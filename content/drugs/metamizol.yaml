id: metamizol
name: Metamizol
synonyms: [dipirona]
atc: N02BB02
presentations:
  - id: jarabe-250-5
    label: Jarabe 250 mg/5 mL
    form: jarabe
    mgPerUnit: 50
    unit: mL
    step: 0.1
    brandsPE: [Antalgina, Repriman]
  - id: gotas-400
    label: Gotas 400 mg/mL (medir con jeringa de 1 mL)
    form: gotas
    mgPerUnit: 400
    unit: mL
    step: 0.05
    brandsPE: [Antalgina]
rules:
  - id: fiebre-dolor-vo
    indication: Fiebre o dolor (3 meses a 8 años, hasta 30 kg)
    route: VO
    ageMinDays: 90
    ageMaxDays: 3284
    basis: mg/kg/dose
    amountMin: 8
    amountMax: 16
    usual: 10
    intervalHours: 6
    maxPerDoseMg: 500
    maxPerDayMg: 2000
    notes: >-
      AEMPS (gotas): 8–16 mg/kg por dosis en niños de hasta 7–9 años; 10 mg/kg suele bastar para la
      fiebre. Intervalo de 6–8 h y hasta 4 dosis al día (ficha inyectable). La ficha no incluye dosis
      para menores de 3 meses ni de 5 kg. Tope de 500 mg/dosis y 2000 mg/día: tramo de 24–30 kg de la
      tabla de la ficha. En Perú las gotas son de 400 mg/mL (libro Peña Camarena); en España, de
      500 mg/mL: no intercambiar. Libro Peña Camarena: 15–25 mg/kg/dosis (rango mayor que el de la
      ficha AEMPS; la app usa el de la ficha).
    sourceIds: [aemps-ft-83494, aemps-ft-42304, pena-camarena]
    countryNotes:
      - country: PE
        text: El FNME solo incluye metamizol inyectable (niños 10–12 mg/kg IM), dentro del rango de la ficha AEMPS. El libro Peña Camarena indica 15–25 mg/kg/dosis por vía oral.
        sourceIds: [fnme-2008, pena-camarena]
      - country: ES
        text: Las gotas españolas son de 500 mg/mL (1 gota = 25 mg); las peruanas, de 400 mg/mL.
        sourceIds: [aemps-ft-83494]
warnings:
  - Riesgo de agranulocitosis; suspender ante fiebre, dolor de garganta o úlceras orales.
  - Puede producir hipotensión.
contraindications:
  - Antecedente de agranulocitosis o alteraciones de la médula ósea.
  - Déficit de glucosa-6-fosfato deshidrogenasa.
  - Porfiria aguda intermitente.
diagnoses: [fiebre, dolor]
review:
  status: borrador
  author: Diego
  reviewers: []
