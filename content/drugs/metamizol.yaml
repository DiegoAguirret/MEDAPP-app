rules:
  - id: fiebre-dolor-vo
    indication: Fiebre o dolor que no responde a otros antipiréticos
    route: VO
    ageMinDays: 90
    basis: mg/kg/dose
    amountMin: 8
    amountMax: 16
    usual: 12
    intervalHours: 6
    maxPerDoseMg: 1000
    maxPerDayMg: 4000
    notes: No usar en menores de 3 meses ni con menos de 5 kg.
    sourceIds: [aemps-cima, pediamecum-aep, digemid-ficha]
warnings:
  - Riesgo de agranulocitosis; suspender ante fiebre, dolor de garganta o úlceras orales.
