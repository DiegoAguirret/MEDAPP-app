warnings:
  - No hay experiencia en niños con insuficiencia renal (FDA).
  - Para infusión, diluir a 1 a 20 mg/mL (FDA).
contraindications:
  - Hipersensibilidad al meropenem, a otros carbapenémicos o anafilaxia a betalactámicos.
interactions:
  - Baja el ácido valproico a niveles subterapéuticos, con riesgo de convulsiones (FDA).
  - El probenecid aumenta sus niveles; no se recomienda junto (FDA).
renal: FDA — no hay experiencia en niños con insuficiencia renal; la ficha solo trae ajuste para adultos.
diagnoses: [meningitis, sepsis, infección intraabdominal, infecciones graves]
