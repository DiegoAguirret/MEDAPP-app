      FNME — niños, 1.25 mg/kg cada 6 h por 2 a 5 días; máximo 8.8 mg/kg/día. Los topes son la dosis del adulto
      (100 mg cada 6 h).
    sourceIds: [fnme-2008, digemid-pnume-2023]
  - id: giardiasis
    indication: Giardiasis (1 mes o más)
    route: VO
    ageMinDays: 29
    basis: mg/kg/day
    amountMin: 6
    amountMax: 6
    usual: 6
    intervalHours: 6
    maxPerDoseMg: 100
    maxPerDayMg: 400
    durationText: 7 a 10 días (FNME).
    notes: FNME — giardiasis, 6 mg/kg/día en 4 dosis por 7 a 10 días. Topes de la dosis del adulto (100 mg cada 6 h).
    sourceIds: [fnme-2008, digemid-pnume-2023]
warnings:
  - No tomar alcohol durante el tratamiento ni hasta 4 días después (FNME).
contraindications:
  - Hipersensibilidad a la furazolidona.
  - Menores de 1 mes (FNME).
  - Uso con IMAO, aminas simpaticomiméticas o alimentos ricos en tiramina (FNME).
diagnoses: [giardiasis, diarrea bacteriana, diarrea]
