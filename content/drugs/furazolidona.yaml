rules:
  - id: diarrea-bacteriana
    indication: Diarrea bacteriana (1 mes o más)
    route: VO
    ageMinDays: 29
    basis: mg/kg/dose
    amountMin: 1.25
    amountMax: 1.25
    usual: 1.25
    intervalHours: 6
    maxPerDoseMg: 100
