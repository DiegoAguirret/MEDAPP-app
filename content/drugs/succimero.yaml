warnings:
  - Identificar y retirar la fuente de plomo antes de empezar (FDA).
  - Controlar hemograma (suspender si los neutrófilos bajan de 1200/µL) y transaminasas (suspender si superan 5 veces el límite) (FDA).
  - No se ha establecido la seguridad de más de 3 semanas seguidas (FDA).
  - Si no puede tragar, se puede mezclar con un poco de comida blanda (FDA, para la cápsula).
contraindications:
  - Hipersensibilidad al succímero.
interactions:
  - No se recomienda junto con otro quelante como el edetato cálcico disódico (FDA).
  - Falsos positivos de cetonas en orina y valores falsamente bajos de ácido úrico y CPK (FDA).
renal: FDA — evaluar la función renal antes y durante el tratamiento.
diagnoses: [intoxicación por plomo, saturnismo, plomo en sangre]
