warnings:
  - Las dosis son de citrato de cafeína; la dosis de cafeína base es la mitad (20 mg de citrato = 10 mg de cafeína base).
  - La apnea del prematuro es un diagnóstico de exclusión; descartar antes otras causas (FDA, OMS).
  - Vigilar la aparición de enterocolitis necrotizante (FDA).
  - Medir la cafeína sérica basal si recibió teofilina o si la madre consumió cafeína antes del parto. Niveles mayores de 50 mg/L se asocian a toxicidad grave (FDA).
  - Precaución en convulsiones, cardiopatía e insuficiencia renal o hepática (FDA).
  - La OMS da esta pauta para recién nacidos de menos de 35 semanas y menos de 2 kg; la FDA, para prematuros.
contraindications:
  - Hipersensibilidad a cualquiera de sus componentes.
interactions:
  - 'Cimetidina y ketoconazol: pueden requerir dosis menores de cafeína (FDA).'
  - 'Fenobarbital y fenitoína: pueden requerir dosis mayores de cafeína (FDA).'
  - 'Teofilina: no se recomienda el uso conjunto (FDA).'
renal: FDA — no hay estudios en insuficiencia renal; usar con precaución, medir niveles y ajustar la dosis.
diagnoses: [apnea del prematuro, apnea, prematuro]
