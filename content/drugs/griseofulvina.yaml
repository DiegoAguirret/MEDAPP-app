warnings:
  - Por debajo de 13 kg el FNME no da dosis; la FDA da 10 mg/kg/día desde los 2 años.
contraindications:
  - Hipersensibilidad a la griseofulvina.
  - Porfiria.
  - Insuficiencia hepática.
  - Lupus eritematoso o síndromes parecidos.
diagnoses: [tiña capitis, tiña, tinea, dermatofitosis, hongos, micosis]
