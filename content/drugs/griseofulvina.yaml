      FNME — de 13 a 22 kg, 125 a 250 mg/día. FDA — mayores de 2 años, 10 mg/kg/día (de 30 a 50
      libras, 125 a 250 mg/día). Libro Peña Camarena — 10 mg/kg/día cada 24 h.
    sourceIds: [fnme-2008, fda-griseofulvin, pena-camarena]
  - id: tinas-22-kg-o-mas
    indication: Tiña de la cabeza, del cuerpo o de los pies (22 kg o más)
    route: VO
    ageMinDays: 730
    weightMinKg: 22
    basis: fixed_by_age
    amountMin: 250
    amountMax: 500
    intervalHours: 24
    maxPerDoseMg: 500
    maxPerDayMg: 500
    durationText: tiña de la cabeza 4 a 6 semanas; del cuerpo 2 a 4; de los pies 4 a 8
