warnings:
  - No se ha establecido la dosis en menores de 2 meses ni el ajuste renal pediátrico (FDA).
  - Los topes de las reglas son técnicos (la dosis por kg con 40 kg); la FDA no da un tope pediátrico en mg.
contraindications:
  - Alergia a penicilinas, cefalosporinas o inhibidores de betalactamasa.
interactions:
  - Inactiva a los aminoglucósidos si se mezclan; no darlos en la misma solución (FDA).
  - Con vancomicina, mayor riesgo de lesión renal aguda (FDA).
  - El probenecid prolonga su vida media (FDA).
diagnoses: [apendicitis, peritonitis, neumonía nosocomial, infección intraabdominal]
