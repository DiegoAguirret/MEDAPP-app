warnings:
  - Las dosis están en microgramos (mcg) por día.
  - Dar en una sola toma, en ayunas, de media hora a una hora antes del desayuno, y al menos 4 horas antes o después de los fármacos que interfieren con su absorción (FDA).
  - Si el niño no puede tragar la tableta, triturarla, suspenderla en 5 a 10 mL de agua y darla de inmediato con cuchara o gotero; no guardar la suspensión (FDA).
  - Con riesgo de hiperactividad, empezar con un cuarto de la dosis y subir un cuarto cada semana hasta la dosis completa (FDA).
  - Ajustar la dosis según la respuesta clínica y los controles de laboratorio (FDA).
contraindications:
  - Insuficiencia suprarrenal no corregida.
diagnoses: [hipotiroidismo, hipotiroidismo congénito, mixedema]
