    maxPerDayMg: 750
    notes: >-
      FDA (Synthroid), tabla 2 — de 0 a 3 meses, 10 a 15 mcg/kg/día en una toma. En el RN con riesgo de
      insuficiencia cardíaca, empezar con menos y subir cada 4 a 6 semanas. El FNME da 25 mcg/día en el
      hipotiroidismo congénito, ajustando 25 mcg cada 2 a 4 semanas. Los topes son técnicos (la dosis por kg con
      50 kg).
    sourceIds: [fda-synthroid, fnme-2008, digemid-pnume-2023]
