  - id: neurocisticercosis
    indication: Neurocisticercosis (mayores de 4 años)
    route: VO
    ageMinDays: 1461
    weightMaxKg: 50
    basis: mg/kg/dose
    amountMin: 16.7
    amountMax: 33
    usual: 16.7
    intervalHours: 8
    maxPerDoseMg: 1650
    maxPerDayMg: 4950
    durationText: 14 a 21 días (FNME); 14 días, o 30 con quistes gigantes o subaracnoideos (OMS).
    notes: FNME — 16.7 a 33 mg/kg 3 veces al día por 14 a 21 días. OMS — 17 a 33 mg/kg 3 veces al día. Sin tope en mg en las fuentes (el tope es técnico).
    sourceIds: [fnme-2008, who-mfc-2010, digemid-pnume-2023]
warnings:
  - No usar en menores de 4 años (FNME); la FDA lo aprueba desde 1 año.
contraindications:
  - Hipersensibilidad al praziquantel.
  - Cisticercosis ocular.
  - Cisticercosis espinal.
  - Uso de rifampicina (FDA).
renal: FNME y OMS — no parece necesario ajustar la dosis.
