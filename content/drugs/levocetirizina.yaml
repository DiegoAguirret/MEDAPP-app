warnings:
  - Ajustar la dosis en insuficiencia renal desde los 12 años (FDA).
  - No figura en el FNME 2008; la pauta es la de la ficha FDA.
contraindications:
  - Hipersensibilidad a la levocetirizina o a la cetirizina.
  - Insuficiencia renal terminal (depuración menor de 10 mL/min) o hemodiálisis.
diagnoses: [urticaria, rinitis alérgica, alergia, prurito]
