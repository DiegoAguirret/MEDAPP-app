warnings:
  - Recuadro negro de la FDA por tendinitis y rotura de tendón, neuropatía periférica, efectos en el sistema nervioso central y empeoramiento de la miastenia gravis.
  - El FNME dice que su uso en menores de 18 años no ha sido establecido; reservarlo para cuando no hay alternativa.
contraindications:
  - Hipersensibilidad al ciprofloxacino o a otras quinolonas.
  - Uso de tizanidina.
renal: FDA — no hay información para ajustar la dosis en niños con insuficiencia renal.
diagnoses: [infección urinaria complicada, pielonefritis]
