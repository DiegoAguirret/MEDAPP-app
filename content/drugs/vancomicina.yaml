    amountMax: 15
    usual: 15
    once: true
    maxPerDoseMg: 75
    maxPerDayMg: 75
    notes: >-
      FNME y FDA — 15 mg/kg de inicio; luego 10 mg/kg c/12 h la primera semana y c/8 h hasta el mes. En
      prematuros pueden necesitarse intervalos más largos (FDA). El rango de 1 a 5 kg de la regla es
