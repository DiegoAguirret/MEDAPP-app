    notes: >-
      FNME y FDA — 10 mg/kg IV c/6 h (40 mg/kg/d), cada dosis en 60 min o más. La FDA no da tope
      pediátrico en mg; el FNME dice «no exceder 2 g/d en niños» junto a la dosis oral. El tope de la
      regla es técnico (10 mg/kg con 50 kg).
    presentationIds: [frasco-500-rec]
    sourceIds: [fnme-2008, fda-vancomycin, digemid-pnume-2023]
  - id: neonato-carga
    indication: Neonatos, dosis inicial
    route: IV
    neonatal: true
    ageMinDays: 0
    ageMaxDays: 28
    weightMinKg: 1
    weightMaxKg: 5
