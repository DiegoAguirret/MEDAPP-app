warnings:
  - Infundir cada dosis en 60 min o más, diluida a 5 mg/mL o menos (hasta 10 mg/mL si hay restricción de líquidos), FDA.
  - Vigilar niveles séricos y función renal; en neonatos se recomienda vigilar niveles (FDA).
  - Vigilar signos de ototoxicidad (FDA).
  - En el Perú requiere autorización del Comité de Control de Infecciones Intrahospitalarias o, en su defecto, del Comité Farmacoterapéutico (PNUME 2023).
contraindications:
  - Hipersensibilidad a la vancomicina.
interactions:
  - Con piperacilina/tazobactam aumenta la lesión renal aguda; vigilar la función renal (FDA).
  - Otros nefrotóxicos aumentan el riesgo de lesión renal (FDA).
  - Con anestésicos, eritema y rubor por histamina; infundir antes de la inducción (FDA).
  - Incompatible en la misma solución con betalactámicos; lavar la vía entre ambos (FDA).
renal: >-
  FDA — la dosis inicial no debe ser menor de 15 mg/kg en cualquier grado de insuficiencia; luego
  guiarse por niveles valle. Anéfricos: 15 mg/kg y luego 1.9 mg/kg cada 24 h.
diagnoses: [sepsis, infección por estafilococo resistente, endocarditis, meningitis]
