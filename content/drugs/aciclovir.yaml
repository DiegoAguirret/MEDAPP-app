rules:
  - id: varicela
    indication: Varicela (2 años o más)
    route: VO
    ageMinDays: 730
    basis: mg/kg/dose
    amountMin: 20
    amountMax: 20
    usual: 20
    intervalHours: 6
    maxPerDoseMg: 800
    maxPerDayMg: 3200
    durationText: 5 días
    notes: >-
      FDA — 20 mg/kg por dosis 4 veces al día (80 mg/kg/día) por 5 días; desde 40 kg, dosis de
      adulto, 800 mg 4 veces al día (tope usado aquí). FNME — 20 mg/kg en mayores de 2 años y menos
      de 40 kg por 5 días.
    sourceIds: [fda-acyclovir, fnme-2008]
warnings:
  - Por vía oral, la seguridad en menores de 2 años no está establecida (FDA).
  - En daño renal se reduce la dosis o se alarga el intervalo según la depuración de creatinina (FNME).
contraindications:
  - Hipersensibilidad al aciclovir o al valaciclovir.
diagnoses: [varicela, herpes, herpes zoster, virus]
