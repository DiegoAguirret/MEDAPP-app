    maxPerDayMg: 12500
    notes: >-
      FNME — niños, 412.5 mg/kg IV a 0.625 a 1.25 g/min; dosis máxima 12.5 g (50 mL). FDA (Nithiodote) — niños, 1
      mL/kg (250 mg/kg), sin pasar de 50 mL, justo después del nitrito de sodio. Si reaparecen los signos, repetir la
      mitad de la dosis.
    presentationIds: [amp-250]
    sourceIds: [fnme-2008, fda-nithiodote, digemid-pnume-2023]
warnings:
  - El FNME (412.5 mg/kg) y la FDA (250 mg/kg) difieren; ambos topan en 12.5 g (50 mL).
contraindications:
  - Hipersensibilidad al tiosulfato de sodio (FNME).
diagnoses: [intoxicación por cianuro, intoxicación]
