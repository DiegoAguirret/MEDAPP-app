id: adrenalina
name: Adrenalina (epinefrina)
category: urgencia
emergency: true
synonyms: [epinefrina, epinephrine, adrenaline]
atc: C01CA24
presentations:
  - id: amp-1-1000
    label: Ampolla 1 mg/mL (1:1000)
    form: ampolla
    mgPerUnit: 1
    unit: mL
    step: 0.01
    brandsPE: []
  - id: dil-1-10000
    label: Adrenalina 1:10 000 = 0.1 mg/mL (1 mL de la ampolla 1:1000 + 9 mL de SF)
    form: ampolla
    mgPerUnit: 0.1
    unit: mL
    step: 0.1
    brandsPE: []
rules:
  - id: anafilaxia-im
    indication: Anafilaxia o broncoespasmo severo (IM)
    route: IM
    ageMinDays: 29
    basis: mg/kg/dose
    amountMin: 0.01
    amountMax: 0.01
    usual: 0.01
    repeatMinutes: { min: 5, max: 15 }
    maxPerDoseMg: 0.3
    maxPerDayMg: 0.3
    notes: >-
      FNME — 0.01 mg/kg SC o IM hasta un máximo de 0.3 mg, repetir cada 5 min si es necesario. OMS —
      repetir cada 5 a 15 min; aplicar en el muslo; medir con jeringa de 1 mL.
    presentationIds: [amp-1-1000]
    countryNotes:
      - country: INT
        text: OMS (Pocket Book 2013) — en anafilaxia usa dosis fijas de la solución 1:1000 IM, 0.15 mL (0.3 mL en mayores de 6 años).
        sourceIds: [who-pocket-2013]
    sourceIds: [fnme-2008, who-pocket-2013]
  - id: paro-iv
    indication: Paro cardiorrespiratorio (IV)
    route: IV
    ageMinDays: 29
    basis: mg/kg/dose
    amountMin: 0.005
    amountMax: 0.01
    usual: 0.01
    repeatMinutes: { min: 3, max: 5 }
    maxPerDoseMg: 0.5
    maxPerDayMg: 0.5
    notes: >-
      FNME — niños, IV 5 a 10 µg/kg cada 3 a 5 min si es necesario; dosis máxima en niños 500 µg
      por dosis. Usar la dilución 1:10 000 (OMS: 1 mL de 1:1000 + 9 mL de SF o dextrosa al 5 %).
    presentationIds: [dil-1-10000]
    sourceIds: [fnme-2008, who-pocket-2013]
warnings:
  - No confundir 1:1000 (1 mg/mL, para IM) con 1:10 000 (0.1 mg/mL, para IV).
  - Tener a mano bolsa y mascarilla, oxígeno y acceso venoso (OMS).
contraindications:
  - Hipersensibilidad a la epinefrina.
diagnoses:
  [
    anafilaxia,
    shock anafiláctico,
    paro cardíaco,
    paro cardiorrespiratorio,
    broncoespasmo severo,
    reanimación,
  ]
review:
  status: verificado
  author: Diego
  reviewers: []
  reviewedAt: 2026-11-04
testCases:
  - ruleId: anafilaxia-im
    presentationId: amp-1-1000
    weightKg: 12
    ageDays: 1095
    expect: { mgPerDose: 0.12, amount: 0.12, unit: mL }
  - ruleId: anafilaxia-im
    presentationId: amp-1-1000
    weightKg: 40
    ageDays: 4380
    expect: { mgPerDose: 0.3, amount: 0.3, unit: mL }
  - ruleId: paro-iv
    presentationId: dil-1-10000
    weightKg: 12
    ageDays: 1095
    expect: { mgPerDose: 0.12, amount: 1.2, unit: mL }
  - ruleId: paro-iv
    presentationId: dil-1-10000
    weightKg: 60
    ageDays: 5110
    expect: { mgPerDose: 0.5, amount: 5, unit: mL }
