    unit: tableta
    step: 1
    brandsPE: []
rules:
  - id: vomitos-gastroenteritis
    indication: Vómitos en gastroenteritis aguda, para permitir la rehidratación oral (6 meses o más)
    route: VO
    ageMinDays: 180
    basis: mg/kg/dose
    amountMin: 0.15
    amountMax: 0.15
    usual: 0.15
    intervalHours: 24
    maxPerDoseMg: 8
    maxPerDayMg: 8
    durationText: Dosis única.
    notes: >-
      Sociedad Canadiense de Pediatría: dosis única de 0.15 mg/kg (máximo 8 mg) desde los 6 meses;
      alternativa por peso: 8–15 kg 2 mg, 15–30 kg 4 mg, más de 30 kg 6–8 mg. IDSA 2017: puede
      darse en mayores de 4 años; sin recomendación en menores.
    sourceIds: [cps-ondansetron-2018, idsa-diarrhea-2017]
warnings:
  - Prolongación del intervalo QT.
contraindications:
  - Síndrome de QT largo congénito.
diagnoses: [vómitos, gastroenteritis aguda]
review:
  status: borrador
  author: Diego
  reviewers: []
