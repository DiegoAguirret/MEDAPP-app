id: ondansetron
name: Ondansetrón
tallMan: ONDANSETRÓN
synonyms: []
atc: A04AA01
presentations:
  - id: sol-4-5
    label: Solución oral 4 mg/5 mL
    form: jarabe
    mgPerUnit: 0.8
    unit: mL
    step: 0.1
    brandsPE: []
  - id: tab-4
    label: Tableta bucodispersable 4 mg
    form: tableta
