rules:
  - id: fiebre-dolor-vo
    indication: Fiebre o dolor leve a moderado
    route: VO
    ageMinDays: 29
    basis: mg/kg/dose
    amountMin: 10
    amountMax: 15
    usual: 15
    intervalHours: 6
    maxPerDoseMg: 1000
    maxPerDayMg: 4000
    notes: >-
      Niños: 10–15 mg/kg cada 4–6 h (FNME); la app usa cada 6 h, que limita a 60 mg/kg/día. Máximo de
      adulto 4 g/día (FNME y FDA). De 29 días a 2 años no superar 60 mg/kg/día (FDA).
    sourceIds: [fnme-2008, fda-acetaminophen-iv, aemps-ft-49302, pena-camarena]
    countryNotes:
      - country: ES
        text: La AEMPS fija un máximo de 3 g/día en niños de más de 38 kg y 80 mg/kg/día en menores de 37 kg.
        sourceIds: [aemps-ft-49302]
warnings:
  - Hepatotoxicidad en sobredosis; verificar otros productos que contengan paracetamol.
contraindications:
  - Insuficiencia hepática grave.
diagnoses: [fiebre, dolor]
