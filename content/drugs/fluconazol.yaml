  - id: orofaringea-desde-dia-2
    indication: Candidiasis orofaríngea o esofágica (desde el segundo día)
    route: VO
    ageMinDays: 29
    basis: mg/kg/dose
    amountMin: 3
    amountMax: 3
    usual: 3
    intervalHours: 24
    maxPerDoseMg: 100
    maxPerDayMg: 100
    durationText: al menos 2 semanas (orofaríngea) o 3 semanas (esofágica)
    notes: >-
      FDA — 3 mg/kg una vez al día; en adultos, 100 mg/día (tope usado aquí). En la esofágica se
      puede subir hasta 12 mg/kg/día según la respuesta. FNME — continuar 2 semanas después de que
      los exámenes sean negativos.
    presentationIds: [susp-50-5]
    sourceIds: [fda-fluconazole, fnme-2008]
warnings:
  - En neonatos prematuros, durante las 2 primeras semanas de vida, la misma dosis se da cada 72 h (FDA).
  - Ajustar la dosis en insuficiencia renal (FDA).
contraindications:
  - Hipersensibilidad al fluconazol.
diagnoses: [candidiasis, muguet, candidiasis oral, hongos, micosis]
