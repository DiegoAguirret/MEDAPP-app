id: fluconazol
name: Fluconazol
category: antifungico
synonyms: [fluconazole]
atc: J02AC01
presentations:
  - id: susp-50-5
    label: Suspensión 50 mg/5 mL
    form: suspension
    mgPerUnit: 10
    unit: mL
    step: 0.1
    brandsPE: []
  - id: tab-150
    label: Tableta 150 mg
    form: tableta
    mgPerUnit: 150
    unit: tableta
    step: 1
    brandsPE: []
  - id: iny-2
    label: Solución para infusión 2 mg/mL (lista para usar)
    form: ampolla
    mgPerUnit: 2
    unit: mL
    step: 1
    brandsPE: []
rules:
  - id: orofaringea-dia-1
    indication: Candidiasis orofaríngea o esofágica (primer día)
    route: VO
    ageMinDays: 29
    basis: mg/kg/dose
    amountMin: 6
    amountMax: 6
    usual: 6
    intervalHours: 24
    maxPerDoseMg: 200
    maxPerDayMg: 200
    durationText: solo el primer día
    notes: FDA — 6 mg/kg el primer día; en adultos, 200 mg el primer día (tope usado aquí). FNME — igual.
    presentationIds: [susp-50-5]
    sourceIds: [fda-fluconazole, fnme-2008]
  - id: orofaringea-desde-dia-2
    indication: Candidiasis orofaríngea o esofágica (desde el segundo día)
    route: VO
    ageMinDays: 29
    basis: mg/kg/dose
    amountMin: 3
    amountMax: 3
    usual: 3
    intervalHours: 24
    maxPerDoseMg: 100
    maxPerDayMg: 100
    durationText: al menos 2 semanas (orofaríngea) o 3 semanas (esofágica)
    notes: >-
      FDA — 3 mg/kg una vez al día; en adultos, 100 mg/día (tope usado aquí). En la esofágica se
      puede subir hasta 12 mg/kg/día según la respuesta. FNME — continuar 2 semanas después de que
      los exámenes sean negativos.
    presentationIds: [susp-50-5]
    sourceIds: [fda-fluconazole, fnme-2008]
  - id: candidiasis-sistemica-iv
    indication: Candidiasis sistémica, IV (1 mes o más)
    route: IV
    ageMinDays: 29
    basis: mg/kg/dose
    amountMin: 6
    amountMax: 12
    usual: 6
    intervalHours: 24
    maxPerDoseMg: 600
    maxPerDayMg: 600
    notes: >-
      FDA — infecciones sistémicas por Candida, 6 a 12 mg/kg/día; la dosis IV es igual a la oral; no pasar
      de 600 mg/día. Infundir a no más de unos 200 mg por hora.
    presentationIds: [iny-2]
    sourceIds: [fda-fluconazole-iv, fnme-2008, digemid-pnume-2023]
warnings:
  - En neonatos prematuros, durante las 2 primeras semanas de vida, la misma dosis se da cada 72 h (FDA).
  - Ajustar la dosis en insuficiencia renal (FDA).
contraindications:
  - Hipersensibilidad al fluconazol.
diagnoses: [candidiasis, muguet, candidiasis oral, candidiasis sistémica, hongos, micosis]
renal: FNME — depuración de creatinina de 21 a 49 mL/min, 50 % de la dosis. FDA — menos de 50 mL/min, 50 % de la dosis.
renalTiers:
  - gfrMin: 0
    gfrMax: 50
    text: 50 % de la dosis (FDA, menos de 50 mL/min; el FNME lo indica de 21 a 49 mL/min).
    sourceIds: [fda-fluconazole, fnme-2008]
