warnings:
  - >-
    FDA (recuadro negro) — se han reportado eventos neuropsiquiátricos graves (agitación,
    agresividad, depresión, trastornos del sueño, ideas o conductas suicidas).
  - Si tiene asma y rinitis alérgica, una sola dosis al día en la noche (FDA).
  - No figura en el FNME 2008; la pauta es la de la ficha FDA.
contraindications:
