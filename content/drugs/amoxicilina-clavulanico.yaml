rules:
  - id: menores-3-meses
    indication: Lactantes menores de 3 meses (dosis expresada como amoxicilina)
    route: VO
    ageMinDays: 29
    ageMaxDays: 89
    basis: mg/kg/day
    amountMin: 30
    amountMax: 30
    usual: 30
    intervalHours: 12
    maxPerDoseMg: 875
    maxPerDayMg: 1750
    notes: >-
      FNME — 15 mg/kg cada 12 h; FDA — 30 mg/kg/día cada 12 h (misma dosis). La FDA recomienda en esta
      edad la suspensión de 125 mg/31.25 mg por 5 mL.
    presentationIds: [susp-125-31-5, susp-400-57-5]
    sourceIds: [fnme-2008, fda-amox-clav]
  - id: estandar-cada-12h
    indication: Infecciones susceptibles, pauta cada 12 h (dosis expresada como amoxicilina)
    route: VO
    ageMinDays: 90
    basis: mg/kg/day
    amountMin: 25
    amountMax: 45
    usual: 45
    intervalHours: 12
    maxPerDoseMg: 875
    maxPerDayMg: 1750
    notes: >-
      FDA — desde las 12 semanas: 25–45 mg/kg/día cada 12 h, hasta la dosis de adulto (875 mg cada 12 h);
      más de 40 kg, dosis de adulto. Usar la formulación 7:1 (400/57).
    presentationIds: [susp-400-57-5, tab-875-125]
    sourceIds: [fnme-2008, fda-amox-clav]
    countryNotes:
      - country: PE
        text: FNME — 12.5 mg/kg cada 12 h en infecciones leves o moderadas y 22.5 mg/kg cada 12 h en otitis, neumonía o sinusitis (25–45 mg/kg/día). El PNUME 2023 lista las suspensiones 4:1 (125/31.25 y 250/62.5), que van con la pauta cada 8 h.
        sourceIds: [fnme-2008]
      - country: ES
        text: En España la suspensión 4:1 se dosifica de 20/5 a 60/15 mg/kg/día en tres tomas; no intercambiar presentaciones de distinta proporción.
        sourceIds: [aemps-ft-64111]
  - id: estandar-cada-8h
    indication: Infecciones susceptibles, pauta cada 8 h con presentación 4:1 (dosis expresada como amoxicilina)
    route: VO
    ageMinDays: 90
    basis: mg/kg/day
    amountMin: 20
    amountMax: 40
    usual: 40
    intervalHours: 8
    maxPerDoseMg: 500
    maxPerDayMg: 1500
    notes: >-
      FDA — desde las 12 semanas y con menos de 40 kg: 20 a 40 mg/kg/día cada 8 h con la suspensión de
      125/31.25 o 250/62.5 mg por 5 mL; más de 40 kg, 250 o 500 mg cada 8 h. No intercambiar presentaciones
      de distinta proporción de clavulánico.
    presentationIds: [susp-125-31-5, susp-250-62-5, tab-500-125]
    sourceIds: [fda-amox-clav, aemps-ft-64111, digemid-pnume-2023]
    countryNotes:
      - country: ES
        text: AEMPS — suspensión 4:1 de 20/5 a 60/15 mg/kg/día en tres tomas.
        sourceIds: [aemps-ft-64111]
warnings:
  - Diarrea frecuente por el componente clavulánico.
contraindications:
  - Alergia a penicilinas.
  - Antecedente de ictericia o disfunción hepática por amoxicilina-clavulánico.
diagnoses: [otitis media aguda, sinusitis, mordedura, celulitis]
