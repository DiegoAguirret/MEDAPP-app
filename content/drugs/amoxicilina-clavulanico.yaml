rules:
  - id: menores-3-meses
    indication: Lactantes menores de 3 meses (dosis expresada como amoxicilina)
    route: VO
    ageMinDays: 29
    ageMaxDays: 89
    basis: mg/kg/day
    amountMin: 30
    amountMax: 30
    usual: 30
