    notes: FNME — 15 mg/kg cada 12 h; FDA — 30 mg/kg/día cada 12 h (misma dosis).
    presentationIds: [susp-400-57-5]
    sourceIds: [fnme-2008, fda-amox-clav]
  - id: estandar-cada-12h
    indication: Infecciones susceptibles, pauta cada 12 h (dosis expresada como amoxicilina)
    route: VO
    ageMinDays: 90
    basis: mg/kg/day
    amountMin: 25
    amountMax: 45
    usual: 45
    intervalHours: 12
    maxPerDoseMg: 875
    maxPerDayMg: 1750
    notes: >-
      FDA — desde las 12 semanas: 25–45 mg/kg/día cada 12 h, hasta la dosis de adulto (875 mg cada 12 h);
      más de 40 kg, dosis de adulto. Usar la formulación 7:1 (400/57).
    presentationIds: [susp-400-57-5, tab-875-125]
    sourceIds: [fnme-2008, fda-amox-clav]
    countryNotes:
      - country: PE
        text: FNME — 12.5 mg/kg cada 12 h en infecciones leves o moderadas y 22.5 mg/kg cada 12 h en otitis, neumonía o sinusitis (25–45 mg/kg/día); en Perú la suspensión es 7:1.
        sourceIds: [fnme-2008]
      - country: ES
        text: En España la suspensión 4:1 se dosifica de 20/5 a 60/15 mg/kg/día en tres tomas; no intercambiar presentaciones de distinta proporción.
        sourceIds: [aemps-ft-64111]
warnings:
  - Diarrea frecuente por el componente clavulánico.
contraindications:
  - Alergia a penicilinas.
  - Antecedente de ictericia o disfunción hepática por amoxicilina-clavulánico.
diagnoses: [otitis media aguda, sinusitis, mordedura, celulitis]
