warnings:
  - Con 40 kg o menos, ajustar el volumen del diluyente para evitar sobrecarga de líquidos, hiponatremia y convulsiones (FDA).
  - Riesgo de reacciones de hipersensibilidad, mayor en la primera hora (FDA).
  - La OMS da las mismas dosis por kg, pero la carga en 15 minutos y en glucosa al 5 %.
contraindications:
  - Hipersensibilidad a la acetilcisteína.
renal: Sin ajuste.
diagnoses: [intoxicación por paracetamol, sobredosis de acetaminofén]
