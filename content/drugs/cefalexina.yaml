    durationText: 7–14 días; al menos 10 días en infecciones por estreptococo beta-hemolítico.
    notes: >-
      FDA: 25–50 mg/kg/día en dosis iguales (50–100 mg/kg/día en infecciones graves). La ficha no fija
      el intervalo pediátrico; el libro Peña Camarena indica cada 6 h. Máximo de adulto: 4 g/día en 2 a
      4 dosis.
    sourceIds: [fda-cephalexin, pena-camarena]
  - id: infecciones-graves
    indication: Infecciones graves (mayores de 1 año)
    route: VO
    ageMinDays: 365
    basis: mg/kg/day
    amountMin: 50
    amountMax: 100
    usual: 100
    intervalHours: 6
    maxPerDoseMg: 1000
    maxPerDayMg: 4000
    durationText: 7–14 días según evolución.
    notes: FDA — 50–100 mg/kg/día en infecciones graves. Libro Peña Camarena — 50–100 mg/kg/día cada 6 h, máximo 4 g/día.
    sourceIds: [fda-cephalexin, pena-camarena]
warnings:
  - Posible alergia cruzada con penicilinas.
contraindications:
  - Alergia a cefalosporinas o reacción grave e inmediata a penicilinas.
diagnoses: [impétigo, celulitis, infección de piel]
