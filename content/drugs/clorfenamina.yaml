id: clorfenamina
name: Clorfenamina
category: antihistaminico
synonyms: [clorfeniramina, clorfenamina maleato]
atc: R06AB04
presentations:
  - id: gotas-1
    label: Gotas 1 mg/mL
    form: gotas
    mgPerUnit: 1
    unit: mL
