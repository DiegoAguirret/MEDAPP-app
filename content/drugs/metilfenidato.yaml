  - Esta regla es la dosis de inicio; la dosis de mantenimiento se ajusta cada semana hasta un máximo de 60 mg/día (FDA).
contraindications:
  - Hipersensibilidad al metilfenidato.
  - Uso de IMAO o en los 14 días después de suspenderlos (FDA).
