rules:
  - id: oral
    indication: Infecciones, incluida fiebre tifoidea, oral (1 mes o más)
    route: VO
    ageMinDays: 29
    basis: mg/kg/day
    amountMin: 50
    amountMax: 100
    usual: 50
    intervalHours: 6
    maxPerDoseMg: 1000
    maxPerDayMg: 4000
    notes: >-
      FNME — lactantes de 2 semanas o más, 50 mg/kg/d VO o IV dividido c/6 h; infecciones severas (sepsis,
      meningitis), 75 a 100 mg/kg/d; fiebre tifoidea, 14 días. Máximo 1 g por dosis (OMS) y 4 g/d (OMS y
      FNME).
    presentationIds: [susp-250-5, tab-250, tab-500]
    sourceIds: [fnme-2008, who-pocket-2013, who-mfc-2010, digemid-pnume-2023]
  - id: iv
    indication: Infecciones graves, incluida meningitis, IV (1 mes o más)
    route: IV
    ageMinDays: 29
    basis: mg/kg/day
    amountMin: 50
    amountMax: 100
    usual: 50
    intervalHours: 6
    maxPerDoseMg: 1000
    maxPerDayMg: 4000
    notes: >-
      FNME — 50 mg/kg/d IV dividido c/6 h; severas, 75 a 100 mg/kg/d. OMS — meningitis, 25 mg/kg IM o IV c/6 h
      (máximo 1 g por dosis). FDA — hasta 100 mg/kg/d, y bajar a 50 mg/kg/d en cuanto se pueda.
    presentationIds: [frasco-1g-iv]
    sourceIds: [fnme-2008, who-pocket-2013, fda-chloramphenicol, digemid-pnume-2023]
warnings:
  - Con dosis altas, medir niveles; pico de 15 a 25 mg/L y valle no mayor de 15 mg/L (OMS).
  - Evitar junto con otros fármacos que deprimen la médula ósea (FDA).
  - En el FNME el inyectable es de uso restringido.
contraindications:
  - Hipersensibilidad al cloranfenicol.
interactions:
  - El fenobarbital acelera su metabolismo, y el cloranfenicol sube el fenobarbital y la fenitoína (OMS, FNME).
  - La rifampicina acelera su metabolismo (OMS).
  - Potencia el efecto de la warfarina (OMS).
  - Antagoniza la respuesta al hierro y a la vitamina B12 (FNME, OMS).
renal: >-
  FNME — mayor riesgo de mielotoxicidad; en general no hace falta ajustar. OMS — en insuficiencia grave,
  evitar salvo que no haya alternativa.
diagnoses: [fiebre tifoidea, meningitis bacteriana, infecciones graves]
