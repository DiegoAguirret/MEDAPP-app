warnings:
  - No se ha establecido su seguridad en prematuros ni en neonatos (FDA).
  - La concentración de 330 mg/mL es la reconstitución para uso IM; para IV, diluir según la ficha.
contraindications:
  - Hipersensibilidad a la cefazolina o a otras cefalosporinas.
