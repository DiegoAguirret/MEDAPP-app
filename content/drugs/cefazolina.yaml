    notes: >-
      FDA — dosis diaria total de 25 a 50 mg/kg dividida en 3 o 4 dosis iguales en la mayoría de las
      infecciones leves a moderadamente graves; puede subirse a 100 mg/kg en infecciones graves. La FDA
