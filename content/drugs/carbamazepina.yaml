    notes: >-
      FNME — inicial 10 a 20 mg/kg/d, con aumentos semanales; mantenimiento sin pasar de 35 mg/kg/d
      (400 mg/d), fraccionado c/6 a 8 h. FDA — la suspensión se da c/6 h y las tabletas c/8 a 12 h.
    sourceIds: [fnme-2008, fda-tegretol, digemid-pnume-2023]
    countryNotes:
      - country: US
        text: FDA — mismo inicio y mismo máximo de 35 mg/kg/día, sin tope en mg.
        sourceIds: [fda-tegretol]
      - country: INT
        text: OMS — inicio 5 mg/kg en la noche o 2.5 mg/kg c/12 h; mantenimiento 5 mg/kg 2 a 3 veces al día; hasta 20 mg/kg/día.
        sourceIds: [who-mfc-2010]
  - id: inicio-6-12-anos
    indication: Epilepsia, dosis inicial (6 a 12 años)
    route: VO
    ageMinDays: 2192
    ageMaxDays: 4382
    basis: fixed_by_age
    amountMin: 100
    amountMax: 100
    usual: 100
    intervalHours: 12
    maxPerDoseMg: 100
    maxPerDayMg: 200
    notes: >-
      FNME — inicial 100 mg c/12 h; aumentar cada semana 100 mg/d hasta la respuesta adecuada;
      mantenimiento de 400 a 800 mg/d. FDA — no pasar de 1000 mg/d.
    sourceIds: [fnme-2008, fda-tegretol, digemid-pnume-2023]
warnings:
  - Riesgo de Stevens-Johnson y necrólisis epidérmica tóxica, sobre todo con HLA-B*1502 (FDA, recuadro negro).
  - Anemia aplásica y agranulocitosis (FDA, recuadro negro).
  - La suspensión da picos más altos que la tableta con la misma dosis; empezar con dosis bajas (FDA).
  - No dar la suspensión junto con otros medicamentos líquidos o diluyentes (FDA).
  - Nivel sérico efectivo de 5 a 12 µg/mL (FNME).
contraindications:
  - Antecedente de depresión de la médula ósea.
  - Hipersensibilidad a carbamazepina o a los antidepresivos tricíclicos.
  - IMAO en los últimos 14 días.
  - Uso de nefazodona.
interactions:
  - Macrólidos (eritromicina, claritromicina), fluconazol, isoniazida y omeprazol suben sus niveles (FDA).
  - Fenobarbital, fenitoína y rifampicina bajan sus niveles (FDA).
  - Baja los niveles de lamotrigina, fenitoína, midazolam, warfarina y valproato (FDA).
  - Con valproato, ajustar la dosis o vigilar niveles (FDA).
  - Puede quitar eficacia a los anticonceptivos hormonales (FDA).
  - La suspensión precipita con clorpromazina o tioridazina líquidas (FDA).
renal: >-
  FDA — sin ajuste de dosis; urianálisis y urea basal y periódica. OMS — usar con precaución; en
  insuficiencia grave, dar el 75 % de la dosis y vigilar niveles.
diagnoses: [epilepsia, convulsiones, crisis focales]
