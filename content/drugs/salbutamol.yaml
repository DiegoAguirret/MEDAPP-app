id: salbutamol
name: Salbutamol
category: respiratorio
emergency: true
synonyms: [albuterol]
atc: R03CC02
presentations:
  - id: jarabe-2-5
    label: Jarabe 2 mg/5 mL
    form: jarabe
    mgPerUnit: 0.4
    unit: mL
    step: 0.1
    brandsPE: []
  - id: neb-5
    label: Solución para nebulizar 5 mg/mL
    form: nebulizacion
    mgPerUnit: 5
    unit: mL
    step: 0.1
    brandsPE: []
  - id: tab-4
    label: Tableta 4 mg
    form: tableta
    mgPerUnit: 4
    unit: tableta
    step: 0.5
    brandsPE: []
rules:
  - id: crisis-nebulizado
    indication: Crisis asmática o broncoespasmo (nebulizado)
    route: INH
    ageMinDays: 29
    basis: fixed_by_age
    amountMin: 2.5
    amountMax: 2.5
    usual: 2.5
    repeatMinutes: { min: 20, max: 20 }
    maxDoses: 3
    maxPerDoseMg: 2.5
    maxPerDayMg: 7.5
    notes: >-
      GINA 2025 — 2.5 mg por nebulizador, una vez en crisis leve y cada 20 min hasta 3 dosis en la
      primera hora en crisis moderada o severa. OMS — nebulizador 2.5 mg por dosis (solución 5
      mg/mL). Completar con suero fisiológico hasta 4 mL (Peña Camarena).
    presentationIds: [neb-5]
    countryNotes:
      - country: PE
        text: El libro de Peña Camarena indica 0.10 a 0.15 mg/kg por dosis (0.03 mL/kg de la solución 5 mg/mL), máximo 5 mg.
        sourceIds: [pena-camarena]
    sourceIds: [gina-2025, who-pocket-2013, pena-camarena]
  - id: vo-2-5-anos
    indication: Broncoespasmo (2 a 5 años, solo jarabe)
    route: VO
    ageMinDays: 730
    ageMaxDays: 2189
    basis: fixed_by_age
    amountMin: 1
    amountMax: 2
    intervalHours: 8
    maxPerDoseMg: 2
    maxPerDayMg: 12
    notes: FNME — 1 a 2 mg cada 6 a 8 h (solo jarabe); máximo 12 mg/día en menores de 6 años. Aquí se calcula cada 8 h.
    presentationIds: [jarabe-2-5]
    countryNotes:
      - country: INT
        text: >-
          GINA 2025 — el salbutamol oral (incluidos jarabes) no se recomienda: actúa más lento y
          tiene más efectos adversos que el inhalado.
        sourceIds: [gina-2025]
    sourceIds: [fnme-2008, gina-2025]
  - id: vo-6-12-anos
    indication: Broncoespasmo (6 a 12 años)
    route: VO
    ageMinDays: 2190
    ageMaxDays: 4744
    basis: fixed_by_age
    amountMin: 2
    amountMax: 4
    intervalHours: 8
    maxPerDoseMg: 4
    maxPerDayMg: 24
    presentationIds: [jarabe-2-5, tab-4]
    notes: FNME — 2 a 4 mg 3 a 4 veces al día; máximo 24 mg/día. Aquí se calcula cada 8 h.
    countryNotes:
      - country: INT
        text: >-
          GINA 2025 — el salbutamol oral no se recomienda por su inicio más lento y mayor riesgo de
          efectos adversos; se prefiere el inhalado.
        sourceIds: [gina-2025]
    sourceIds: [fnme-2008, gina-2025]
warnings:
  - En menores de 2 años la dosis oral no está establecida (FNME).
  - La vía inhalada es la de elección en crisis asmática (GINA 2025). Si no responde a las 3 nebulizaciones en 1 a 2 h, referir al hospital.
contraindications:
  - Hipersensibilidad a simpaticomiméticos.
  - Hipertensión arterial o enfermedad cardíaca.
  - Hipertiroidismo o tirotoxicosis.
diagnoses: [asma, broncoespasmo, sibilancias, bronquitis obstructiva, sob]
review:
  status: verificado
  author: Diego
  reviewers: []
  reviewedAt: 2026-11-04
testCases:
