    presentationId: neb-5
    weightKg: 14
    ageDays: 1095
    expect: { mgPerDose: 2.5, amount: 0.5, unit: mL }
  - ruleId: vo-2-5-anos
    presentationId: jarabe-2-5
    weightKg: 14
    ageDays: 1095
    expect: { mgPerDose: 1, amount: 2.5, unit: mL }
  - ruleId: vo-6-12-anos
    presentationId: jarabe-2-5
    weightKg: 25
    ageDays: 2920
    expect: { mgPerDose: 2, amount: 5, unit: mL }
  - ruleId: vo-6-12-anos
    presentationId: tab-4
    weightKg: 25
    ageDays: 2920
    expect: { mgPerDose: 2, amount: 0.5, unit: tableta }
