rules:
  - id: fiebre-dolor-vo
    indication: Fiebre o dolor leve a moderado (6 meses a 11 años)
    route: VO
    ageMinDays: 180
    ageMaxDays: 4379
    basis: mg/kg/dose
    amountMin: 5
    amountMax: 10
    usual: 10
    intervalHours: 8
    maxPerDoseMg: 400
    maxPerDayMg: 1200
    notes: >-
      FDA: fiebre 5 mg/kg si la temperatura es menor de 39.2 °C (102.5 °F) y 10 mg/kg si es mayor;
      cada 6–8 h; no superar 40 mg/kg/día. Topes de 400 mg/toma y 1200 mg/día: dosis máxima
      de venta libre para 12 años o más (FDA). Administrar con alimentos.
    sourceIds: [fda-ibuprofen-susp, fda-ibuprofen-otc]
warnings:
  - Evitar en deshidratación por riesgo de lesión renal.
  - Riesgo de sangrado gastrointestinal.
contraindications:
  - Hipersensibilidad a AINE o asma inducida por AINE.
diagnoses: [fiebre, dolor]
