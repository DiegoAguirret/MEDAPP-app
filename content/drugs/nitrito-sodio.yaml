id: nitrito-sodio
name: Nitrito de sodio
category: urgencia
synonyms: [sodium nitrite, cianuro, antídoto, intoxicación por cianuro]
presentations:
  - id: amp-30
    label: Nitrito de sodio 30 mg/mL (al 3 %)
    form: ampolla
    mgPerUnit: 30
