rules:
  - id: mantenimiento-1-24-meses
    indication: Mantenimiento, 1 a 24 meses (función renal normal)
    route: VO
    ageMinDays: 29
    ageMaxDays: 730
    basis: mg/kg/dose
    amountMin: 5.6
    amountMax: 9.4
    usual: 5.6
    intervalHours: 12
    maxPerDoseMg: 250
    maxPerDayMg: 500
    notes: >-
      FDA, tabla 2 — de 1 a 24 meses, 11.3 a 18.8 mcg/kg/día, o sea 5.6 a 9.4 mcg/kg por dosis dos veces al día. El
      tope es la dosis de mantenimiento máxima del adulto en el FNME (500 mcg/día).
    sourceIds: [fda-digoxin-solution, fnme-2008, digemid-pnume-2023]
  - id: mantenimiento-2-5-anos
    indication: Mantenimiento, 2 a 5 años (función renal normal)
