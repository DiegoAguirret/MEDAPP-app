    maxPerDoseMg: 250
    maxPerDayMg: 500
    notes: FDA, tabla 2 — de 2 a 5 años, 9.4 a 13.1 mcg/kg/día, o sea 4.7 a 6.6 mcg/kg por dosis dos veces al día.
    sourceIds: [fda-digoxin-solution, fnme-2008, digemid-pnume-2023]
  - id: mantenimiento-5-10-anos
