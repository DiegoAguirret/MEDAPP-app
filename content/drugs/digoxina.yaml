warnings:
  - Las dosis están en microgramos (mcg); 50 mcg = 0.05 mg.
  - Los niveles tóxicos son apenas mayores que los terapéuticos. Con niveles séricos menores de 0.5 ng/mL baja la eficacia y con más de 2 ng/mL aumenta la toxicidad; medir justo antes de la siguiente dosis o al menos 6 horas después de la última (FDA).
  - La dosis de carga (digitalización) y la dosis neonatal dependen de la edad gestacional y no se calculan aquí (FDA, FNME).
  - Reducir la dosis si el peso magro es una fracción pequeña del peso total, por obesidad o edema (FDA).
  - La jeringa de 1 mL que trae el frasco no sirve para medir menos de 0.1 mL (FDA).
contraindications:
  - Hipersensibilidad a la digoxina o a otros digitálicos.
  - Fibrilación ventricular.
renal: >-
  FDA — con función renal anormal, reducir la dosis en proporción, según la tabla 3 de la ficha (por peso magro y
  depuración de creatinina; en niños, con la fórmula de Schwartz). Las dosis calculadas aquí asumen función renal
  normal.
diagnoses: [insuficiencia cardíaca]
