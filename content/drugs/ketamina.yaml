    basis: mg/kg/dose
    amountMin: 6.5
    amountMax: 13
    usual: 6.5
    once: true
    maxPerDoseMg: 650
    maxPerDayMg: 650
    notes: FNME y FDA — inicial IM de 6.5 a 13 mg/kg. Las fuentes no dan tope en mg (el tope es técnico, 13 mg/kg con 50 kg).
    presentationIds: [amp-50]
    sourceIds: [fnme-2008, fda-ketamine, digemid-pnume-2023]
warnings:
  - La FDA no ha establecido su seguridad y eficacia en menores de 16 años.
  - Anestésicos y sedantes por más de 3 horas en niños de 3 años o menos pueden afectar el desarrollo cerebral (FDA).
contraindications:
  - Casos en que una subida importante de la presión arterial sería un riesgo grave (FDA).
  - Hipersensibilidad a la ketamina.
renal: Las fuentes no dan ajuste renal.
diagnoses: [anestesia, sedación para procedimientos]
