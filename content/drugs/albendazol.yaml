  - id: nematodos-1-2-anos
    indication: Nemátodos intestinales (1 a 2 años)
    route: VO
    ageMinDays: 365
    ageMaxDays: 729
    basis: fixed_by_age
    amountMin: 200
    amountMax: 200
    usual: 200
    intervalHours: 24
    maxPerDoseMg: 200
    maxPerDayMg: 200
    durationText: dosis única
    notes: >-
      FNME — menores de 2 años, 200 mg en dosis única; en helmintiasis mixta, 200 mg/día por 3 días.
      El FNME no fija una edad mínima: la app calcula desde el año de edad.
    sourceIds: [fnme-2008, pena-camarena]
warnings:
  - Para hidatidosis, neurocisticercosis y estrongiloidiasis las pautas son otras (15 mg/kg/día); no se calculan aquí.
contraindications:
  - Hipersensibilidad al albendazol o a otros benzimidazoles.
  - Encefalitis aguda o severa por neurocisticercosis.
  - Embarazo.
diagnoses: [parásitos, ascaris, oxiuros, tricocefalo, uncinarias, helmintiasis, desparasitación]
