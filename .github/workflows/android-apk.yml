name: APK de prueba (Android)

# Compila el APK de prueba en Linux (sin el límite de 260 caracteres de Windows)
# y lo publica como pre-release del repositorio.
on:
  workflow_dispatch:
  push:
    branches: [main, feat/verificacion-clinica]
    paths: ['apps/mobile/**', 'packages/**', 'content/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Pruebas del núcleo y simulación clínica
        run: npm test && npm run sim:report
      - name: Pruebas de la app
        working-directory: apps/mobile
        run: npx jest
      - name: Proyecto nativo
        working-directory: apps/mobile
        run: npx expo prebuild -p android --clean
      - name: Compilar APK (arm64-v8a y armeabi-v7a)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Publicar pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="beta-${GITHUB_RUN_NUMBER}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dosis-pediatricas-${TAG}.apk"
          gh release create "$TAG" "dosis-pediatricas-${TAG}.apk" \
            --prerelease --target "$GITHUB_SHA" \
            --title "Beta ${GITHUB_RUN_NUMBER} (prueba — fichas NO VALIDADAS)" \
            --notes "APK de prueba para médicos. Contenido en borrador: no usar en pacientes. Commit ${GITHUB_SHA}."
