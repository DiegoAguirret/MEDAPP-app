name: CI
# Solo a mano (pestaña Actions → «Run workflow»): nunca corre solo ni gasta minutos de Actions.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run content:build
      - run: npm audit --audit-level=high
